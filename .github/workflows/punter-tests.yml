name: PUNTER KENYA tests

on:
  push:
    branches:
      - rebuild/automatic-research-slip-engine
  pull_request:
    branches:
      - main

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile core bot modules
        run: python -m py_compile bot.py sportybet_client.py accumulator_engine.py autobuild_research.py candidate_risk.py
      - name: Test automatic accumulator construction
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Diagnose SportyBet public market catalogue
        run: python scripts/probe_sportybet_feed.py
