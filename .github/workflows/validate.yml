name: Validate Python

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python modules
        run: find . -name '*.py' -not -path './.venv/*' -print0 | xargs -0 python -m py_compile
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v

  mysql-migrations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: punter_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: punter_test
      DB_SSL: "false"
      DB_ALLOW_INSECURE_LOCAL: "true"
      PUNTER_MYSQL_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test migrations against disposable MySQL 8
        run: python -m unittest discover -s tests -p 'test_results_tracker.py' -v
