name: Validate Python

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**', 'feature/sportyclaw-premium-parity']
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python modules
        run: find . -name '*.py' -not -path './.venv/*' -print0 | xargs -0 python -m py_compile
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v

  mysql-migrations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: punter_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: punter_test
      DB_SSL: "false"
      DB_ALLOW_INSECURE_LOCAL: "true"
      PUNTER_MYSQL_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test migrations against disposable MySQL 8
        run: python -m unittest discover -s tests -p 'test_results_tracker.py' -v

  live-bookmaker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install requests==2.32.3
      - name: Probe public Betika and SportyBet feeds (read-only)
        run: |
          python - <<'PY'
          import json
          import sys
          from bookmaker_odds import smoke_test_bookmakers
          result = smoke_test_bookmakers()
          print(json.dumps(result, indent=2))
          # Public bookmaker endpoints can intermittently return HTML/429 for one date.
          # Require at least one successful, priced observation per provider across
          # the checked dates; preserve individual failures in the printed diagnostics.
          for provider in ("Betika", "SportyBet"):
              observations = [
                  item for name, item in result.items()
                  if name == provider or name.startswith(provider + " ")
              ]
              successful = [
                  item for item in observations
                  if item.get("request_ok") and item.get("priced_events", 0) >= 1
              ]
              if not successful:
                  raise SystemExit(f"{provider} returned no successful priced football events across checked dates.")
          PY
